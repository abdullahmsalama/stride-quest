name = "stride-quest-coach"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated list of sites allowed to call the Worker (your GitHub Pages URL).
# localhost is always allowed for testing.
ALLOWED_ORIGINS = "https://abdullahmsalama.github.io"
SITE_URL = "https://abdullahmsalama.github.io/stride-quest/"
RATE_PER_MINUTE = "10"
# Model names change over time; update these if a provider retires one.
GEMINI_MODELS = "gemini-flash-latest,gemini-flash-lite-latest,gemini-3.8-flash"
GEMINI_SMART_MODELS = "gemini-3.8-flash,gemini-flash-latest,gemini-3-flash-preview"
GROQ_MODEL = "llama-3.3-70b-versatile"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"

# Secrets (never put them in this file):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY   (optional)
#   npx wrangler secret put XAI_API_KEY          (optional, xAI/Grok, usually paid)

# Anonymous opt-in comparison data (Stats tab). Schema: migrations/0001_stats.sql
[[d1_databases]]
binding = "DB"
database_name = "stride-quest-stats"
database_id = "17345772-ffcf-4473-8bc3-480beb43e5fb"
migrations_dir = "migrations"
